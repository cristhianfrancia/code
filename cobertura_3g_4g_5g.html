<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Botón</title>
<style>
  :root {
    --bitel-teal: #01768b;
    --bitel-blue: #0c477e;
    --bitel-yellow: #fbf32f;
    --ink: #1d1d1f;
    --surface: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn-container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    padding: 8px;
  }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 26px;
    border-radius: 980px;
    border: none;
    background: linear-gradient(180deg, var(--bitel-blue), #093a68);
    color: var(--surface);
    font-size: 12px;
    font-weight: 590;
    letter-spacing: -0.01em;
    white-space: nowrap;
    cursor: pointer;
    outline: none;
    box-shadow:
      0 1px 2px rgba(9, 34, 58, 0.25),
      0 6px 16px rgba(9, 34, 58, 0.18);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.35s ease;
  }

  .btn::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 55%);
    pointer-events: none;
  }

  .btn .icon {
    font-size: 15px;
    line-height: 1;
    filter: saturate(1.1);
  }

  .btn:hover {
    background: linear-gradient(180deg, #1a5ea3, #0c477e);
  }

  .btn:active {
    transform: scale(0.97);
    box-shadow:
      0 1px 2px rgba(9, 34, 58, 0.22),
      0 3px 8px rgba(9, 34, 58, 0.18);
  }

  .btn:focus-visible {
    box-shadow:
      0 0 0 3px rgba(255, 255, 255, 0.9),
      0 0 0 6px rgba(12, 71, 126, 0.45),
      0 6px 16px rgba(9, 34, 58, 0.18);
  }
</style>
</head>
<body>

  <div class="btn-container">


<button class="btn" onclick="abrirPopup('https://bitel.com.pe/cobertura', 1400, 800, 0.9)">
📶 Cobertura 3G y 4G
</button>


<button class="btn" onclick="abrirPopup('https://earth.google.com/earth/d/10kkrwD_yP33XziQU4h-K9lMHyrdHNo1M?usp=sharing', 1400, 800, 0.9)">
📡 Cobertura 5G
</button>


  </div>

  <script>
    // Centra el popup respecto al MONITOR y lo hace responsive: si el
    // monitor es más chico que el tamaño pedido, se reduce a un porcentaje
    // del área disponible en vez de desbordarse o perder el centrado.
    //
    // "zoom" NO puede escalar el contenido de la página que se abre: Drive,
    // Canva y el script de Apps Script viven en otro dominio, y el navegador
    // bloquea por seguridad que se les inyecte CSS desde acá. Lo que sí se
    // puede controlar de verdad es el tamaño de la VENTANA emergente, así
    // que "zoom" ajusta eso sobre el ancho/alto que le pases: 1 (o dejarlo
    // vacío) = tamaño tal cual lo escribiste, 0.9 = un 10% más chica, etc.
    function abrirPopup(url, ancho = 1500, alto = 900, zoom = 1) {
      const anchoDeseado = Math.round(ancho * zoom);
      const altoDeseado = Math.round(alto * zoom);

      const monitorLeft = window.screenLeft ?? window.screenX ?? 0;
      const monitorTop = window.screenTop ?? window.screenY ?? 0;

      const monitorWidth = window.screen.availWidth || window.screen.width;
      const monitorHeight = window.screen.availHeight || window.screen.height;

      const margen = 0.92; // deja un pequeño respiro respecto al borde de la pantalla
      const anchoFinal = Math.min(anchoDeseado, Math.round(monitorWidth * margen));
      const altoFinal = Math.min(altoDeseado, Math.round(monitorHeight * margen));

      const left = Math.round(monitorLeft + (monitorWidth - anchoFinal) / 2);
      const top = Math.round(monitorTop + (monitorHeight - altoFinal) / 2);

      const opcionesVentana = `width=${anchoFinal},height=${altoFinal},left=${left},top=${top},resizable=yes,scrollbars=yes`;
      window.open(url, "_blank", opcionesVentana);
    }
  </script>

</body>
</html>
