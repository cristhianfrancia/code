<!DOCTYPE html>
<html>
 <head>
  <!--

    <style>
      body {
        font-family: Calibri, Arial, sans-serif;
      }

      .container {
        width: 90%;
        max-width: 1000px;
        margin: 20px auto;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        padding: 50px;
        position: relative;
        transition: box-shadow 0.3s ease;
      }

      .container:hover {
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
      }

      .icon-animation {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 40px;
        height: 40px;
        background-color: #007BFF;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: spin 2s linear infinite;
      }

      .icon-animation::before {
        content: "😎";
        font-size: 1.5rem;
        color: white;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .input-container {
        display: flex;
        align-items: center;
        transition: transform 0.3s ease;
      }

      .input-container:hover {
        transform: scale(1.00);
      }

      .input-container label {
        width: 50%;
      }

      .input-container input, .input-container select {
        width: 50%;
        padding: 4px;
        border: 1px solid #ccc;
        border-radius: 4px;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .input-container input:focus, .input-container select:focus {
        border-color: #007BFF;
        outline: none;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
      }

      /* Estilos responsive */
      @media screen and (max-width: 600px) {
        .input-container {
          flex-direction: column;
        }
        .input-container label, .input-container input, .input-container select {
          width: 100%;
        }
      }

      .resultado-label {
        color: #007BFF;
        font-weight: bold;
      }

      .ruta-container {
        background-color: #fff5e9;
        padding: 10px;
        border-radius: 4px;
        margin: 10px 0;
        border-left: 4px solid #e67a00;
        font-size: 0.9rem;
        color: #333;
      }

      hr {
        border: 1px solid #e67a00;
        margin: 10px 0;
      }

      button {
        background-color: #e67a00;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.3s ease;
        margin: 5px;
      }

      button:hover {
        background-color: #0056b3;
        transform: scale(1.05);
      }

      button:active {
        background-color: #004085;
        transform: scale(0.98);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      button:focus {
        outline: none;
      }

      #resultado {
        margin: 15px 0;
        font-size: 0.9rem;
        background-color: #fff5e9;
        padding: 10px;
        border-left: 4px solid #e67a00;
        white-space: pre-line;
        min-height: 50px;
        transition: background-color 0.3s ease;
      }

      /* Estilos para el mensaje de copiado */
      #mensaje-copia {
        margin-left: 15px;
        font-weight: bold;
        font-size: 0.95rem;
        opacity: 0;
        transition: opacity 0.4s ease;
        vertical-align: middle;
      }

    </style>
 </head>
 <body>

<label style="color: red;"><strong>Plantilla:</strong></label>
<p></p>

<center class="code-container">
<p>
<input type="number" id="label0" oninput="checkLength(this)" placeholder="(Número del que llama)" style="color: #007BFF;" />
// <input type="text" id="label0_1" oninput="updateResultadoOutput()" placeholder="(Consulta del cliente)" style="color: #007BFF;" />
// Se genera reporte de calidad y avería
</p>
</center>

<div class="input-container">
<label for="label_super">- Jefe/Supervisor aprobador del reporte:</label>
<input type="text" id="label_super" oninput="updateResultadoOutput()" placeholder="(Nombre del encargado que aprueba)" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_reclamante">- Condición del Reclamante:</label>
<select id="label_reclamante" onchange="updateResultadoOutput()">
<option value="">Seleccionar</option>
<option value="Abonado nacional">Abonado nacional</option>
<option value="Abonado extranjero">Abonado extranjero</option>
</select>
</div>

<div class="input-container">
<label for="label_padre">- Nombre del padre:</label>
<input type="text" id="label_padre" oninput="updateResultadoOutput()" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_padre">- Nombre de la madre:</label>
<input type="text" id="label_madre" oninput="updateResultadoOutput()" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_fecnac">- Fecha de nacimiento:</label>
<input type="text" id="label_fecnac" oninput="updateResultadoOutput()" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_lugnac">- Lugar de nacimiento:</label>
<input type="text" id="label_lugnac" oninput="updateResultadoOutput()" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_validentidad">- Validó identidad:</label>
<select id="label_validentidad" onchange="updateResultadoOutput()">
<option value="">Seleccionar</option>
<option value="Si">Si</option>
</select>
</div>

<div class="input-container">
<label for="label_valdatos">- Datos validados correctamente: </label>
<select id="label_valdatos" onchange="updateResultadoOutput()">
<option value="">Seleccionar</option>
<option value="Si">Si</option>
</select>
</div>

<div class="input-container">
  <label for="label_FechaHora">- Fecha y hora del inconveniente:</label>
  <input type="datetime-local" id="label_FechaHora" oninput="updateResultadoOutput()" />
</div>

<div class="input-container">
<label for="label_direccion">- Dirección donde presenta los inconvenientes (con referencia válidas, cruce de avenidas, Urbanización – centro poblado - distrito – provincia - departamento):</label>
<input type="text" id="label_direccion" oninput="updateResultadoOutput()" placeholder="(Ejem: Av. Aviación 2270, Frente a La Rambla, Lima - Lima - San Borja...)" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_coordenadas">- Coordenadas: 
  <button type="button" onclick="abrirMapa()" style="padding: 2px 8px; font-size: 0.8rem; background-color: #4285F4; margin-left: 5px;">Google Maps</button>
</label>
<input type="text" id="label_coordenadas" oninput="updateResultadoOutput()" placeholder="(Ej: -12.046374, -77.042793)" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_bts">- BTS:</label>
<input type="text" id="label_bts" oninput="updateResultadoOutput()" placeholder="(Ej: LIM1234)" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_numeroref">- Número de referencia:</label>
<input type="number" id="label_numeroref" oninput="updateResultadoOutput()" placeholder="9xxxxxxxx" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_Cobertura">- Indicador de Cobertura:</label>
<select id="label_Cobertura" onchange="updateResultadoOutput()">
 <option value="">Seleccionar</option>
        <option value="3G (H, H+, 3.5G)">3G (H, H+, 3.5G)</option>
       <option value="4G">4G</option>
       <option value="5G">5G</option>
        <option value="E">E</option>
        <option value="-">-</option>
      </select>
    </div>

<div class="input-container">
<label for="label_mensajeerror">- Mensaje de Error:</label>
<input type="text" id="label_mensajeerror" oninput="updateResultadoOutput()" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_reinicio">- Reinicio su equipo: </label>
<select id="label_reinicio" onchange="updateResultadoOutput()">
<option value="">Seleccionar</option>
<option value="Si">Si</option>
<option value="No">No</option>
</select>
</div>

<div class="input-container">
<label for="label_otralinea">- Cuenta con alguna otra línea que presenta la incidencia: </label>
<select id="label_otralinea" onchange="updateResultadoOutput()">
<option value="">Seleccionar</option>
<option value="Si">Si</option>
<option value="No">No</option>
</select>
</div>

<div class="input-container">
<label for="label_equipo">- Equipo fue adquirido en Bitel: </label>
<select id="label_equipo" onchange="updateResultadoOutput()">
<option value="">Seleccionar</option>
<option value="Si">Si</option>
<option value="No">No</option>
</select>
</div>

<div class="input-container">
<label for="label_os">- Sistema operativo del Dispositivo: </label>
<select id="label_os" onchange="updateResultadoOutput()">
<option value="">Seleccionar</option>
<option value="Android">Android</option>
<option value="IOS">IOS</option>
<option value="Harmony OS">Harmony OS</option>
<option value="Hyper OS">Hyper OS</option>
<option value="Otro">Otro</option>
</select>
</div>

<!-- NUEVOS CAMPOS AGREGADOS -->
<div class="input-container">
<label for="label_persistencia">- Persistencia al desplazamiento: ¿La señal vuelve al moverse?: </label>
<select id="label_persistencia" onchange="updateResultadoOutput()">
<option value="">Seleccionar</option>
<option value="Si">Si</option>
<option value="No">No</option>
<option value="No sabe">No sabe</option>
</select>
</div>

<div class="input-container">
<label for="label_marcamodelo">- Marca y modelo del equipo:</label>
<input type="text" id="label_marcamodelo" oninput="updateResultadoOutput()" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_barras">- Barras de señal: </label>
<select id="label_barras" onchange="updateResultadoOutput()">
<option value="">Seleccionar</option>
<option value="1 barra">1 barra</option>
<option value="2 barras">2 barras</option>
<option value="3 barras">3 barras</option>
<option value="4 barras">4 barras</option>
<option value="5 barras">5 barras</option>
<option value="Sin señal">Sin señal</option>
</select>
</div>
<!-- FIN DE NUEVOS CAMPOS -->

<div class="input-container">
<label for="label_kb">- Cantidad de KB vigente al momento de escalar:</label>
<input type="text" id="label_kb" oninput="updateResultadoOutput()" placeholder="(Ver PCRF u OCS)" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="label_otroequipo">- ¿Se probó el chip en otro equipo y se solucionó el inconveniente?: </label>
<select id="label_otroequipo" onchange="updateResultadoOutput()">
<option value="">Seleccionar</option>
<option value="Si">Si</option>
<option value="No">No</option>
</select>
</div>

<div class="input-container">
<label for="label_DetalleInc">- Detalle del inconveniente: </label>
<input type="text" id="label_DetalleInc" oninput="updateResultadoOutput()" placeholder="(Descripción del problema)" style="color: #007BFF;" />
</div>

<div class="input-container">
<label for="labelID">- Código de la llamada:</label>
<input type="text" id="labelID" placeholder="(Sin $$_ _&&)" style="color: #007BFF;" />
</div>

<br />
<hr />
<br />

<label style="color: red;"><strong>Resultado</strong></label>
<p id="resultado" class="dark-mode-text"></p>

<!-- BOTONES CON EL MENSAJE AL LADO -->
<button onclick="copiarResultado()">Copiar</button> 
<button onclick="limpiarInputs()">Borrar</button>
<span id="mensaje-copia"></span>

<script>
window.onload = function() {
    let fechaLimite = new Date("2026-12-30T23:59:59");
    let fechaActual = new Date();
    if (fechaActual > fechaLimite) {
        document.body.innerHTML = "<h1 style='text-align:center; color:red; margin-top:20%;'>Apartado requiere mantenimiento<br></h1><h5 style='text-align:center; color:red'>(Actualización en proceso)</h5>";
    }
};

      // SELECCIÓN DE TODOS LOS ELEMENTOS
      const label0Input = document.querySelector("#label0");
      const label0_1Input = document.querySelector("#label0_1");
      const label_superInput = document.querySelector("#label_super");
      const label_reclamanteInput = document.querySelector("#label_reclamante");
      const label_padreInput = document.querySelector("#label_padre");
      const label_madreInput = document.querySelector("#label_madre");
      const label_fecnacInput = document.querySelector("#label_fecnac");
      const label_lugnacInput = document.querySelector("#label_lugnac");
      const label_validentidadInput = document.querySelector("#label_validentidad");
      const label_valdatosInput = document.querySelector("#label_valdatos");
      const label_FechaHoraInput = document.querySelector("#label_FechaHora");
      const label_direccionInput = document.querySelector("#label_direccion");
      const label_coordenadasInput = document.querySelector("#label_coordenadas");
      const label_btsInput = document.querySelector("#label_bts");
      const label_numerorefInput = document.querySelector("#label_numeroref");
      const label_CoberturaInput = document.querySelector("#label_Cobertura");
      const label_mensajeerrorInput = document.querySelector("#label_mensajeerror");
      const label_reinicioInput = document.querySelector("#label_reinicio");
      const label_otralineaInput = document.querySelector("#label_otralinea");
      const label_equipoInput = document.querySelector("#label_equipo");
      const label_osInput = document.querySelector("#label_os");
      
      // VARIABLES PARA NUEVOS CAMPOS
      const label_persistenciaInput = document.querySelector("#label_persistencia");
      const label_marcamodeloInput = document.querySelector("#label_marcamodelo");
      const label_barrasInput = document.querySelector("#label_barras");

      const label_kbInput = document.querySelector("#label_kb");
      const label_otroequipoInput = document.querySelector("#label_otroequipo");
      const label_DetalleIncInput = document.querySelector("#label_DetalleInc");
      const labelIDInput = document.querySelector("#labelID");
      
      const resultadoOutput = document.querySelector("#resultado");

      // ARREGLO CON TODOS LOS INPUTS PARA VALIDAR SI ESTÁN VACÍOS AL COPIAR (Actualizado con los nuevos campos)
      const todosLosInputs = [
        label0Input, label0_1Input, label_superInput, label_reclamanteInput,
        label_padreInput, label_madreInput, label_fecnacInput, label_lugnacInput,
        label_validentidadInput, label_valdatosInput, label_FechaHoraInput,
        label_direccionInput, label_coordenadasInput, label_btsInput,
        label_numerorefInput, label_CoberturaInput, label_mensajeerrorInput,
        label_reinicioInput, label_otralineaInput, label_equipoInput,
        label_osInput, label_persistenciaInput, label_marcamodeloInput, label_barrasInput, 
        label_kbInput, label_otroequipoInput, label_DetalleIncInput, labelIDInput
      ];

      // LISTENERS
      todosLosInputs.forEach(input => {
          input.addEventListener(input.tagName === "SELECT" ? "change" : "input", updateResultadoOutput);
      });

function formatDateToDDMMYYYYHHMM(dateString) {
  if (!dateString) return "";
  const dateParts = dateString.split("T");
  const date = dateParts[0];
  const time = dateParts[1] ? dateParts[1].slice(0, 5) : ""; 
  const datePartsFormatted = date.split("-");
  const day = datePartsFormatted[2];
  const month = datePartsFormatted[1];
  const year = datePartsFormatted[0];
  return `${day}/${month}/${year} ${time}`;
}

function updateResultadoOutput() {
    resultadoOutput.innerHTML =`<span class="resultado-label">${label0Input.value}</span> // <span class="resultado-label">${capitalizeFirstLetter(label0_1Input.value)}</span> // Se genera reporte de calidad y avería

- Jefe/Supervisor aprobador del reporte: <span class="resultado-label">${label_superInput.value}</span>
- Condición del Reclamante: <span class="resultado-label">${label_reclamanteInput.value}</span>
- Nombre del padre: <span class="resultado-label">${label_padreInput.value}</span>
- Nombre de la madre: <span class="resultado-label">${label_madreInput.value}</span>
- Fecha de nacimiento: <span class="resultado-label">${label_fecnacInput.value}</span>
- Lugar de nacimiento: <span class="resultado-label">${label_lugnacInput.value}</span>
- Validó identidad: <span class="resultado-label">${label_validentidadInput.value || "Si"}</span>
- Datos validados correctamente: <span class="resultado-label">${label_valdatosInput.value || "Si"}</span>
- Fecha y hora del inconveniente: <span class="resultado-label">${formatDateToDDMMYYYYHHMM(label_FechaHoraInput.value)}</span>
- Dirección donde presenta los inconvenientes (con referencia válidas, cruce de avenidas, Urbanización – centro poblado - distrito – provincia - departamento): <span class="resultado-label">${label_direccionInput.value}</span>
- Coordenadas: <span class="resultado-label">${label_coordenadasInput.value}</span>
- BTS: <span class="resultado-label">${label_btsInput.value}</span>
- Número de referencia: <span class="resultado-label">${label_numerorefInput.value}</span>
- Indicador de cobertura: <span class="resultado-label">${label_CoberturaInput.value}</span>
- Mensaje de Error: <span class="resultado-label">${label_mensajeerrorInput.value}</span>
- Reinicio su equipo: <span class="resultado-label">${label_reinicioInput.value}</span>
- Cuenta con alguna otra línea que presenta la incidencia: <span class="resultado-label">${label_otralineaInput.value}</span>
- Equipo fue adquirido en Bitel: <span class="resultado-label">${label_equipoInput.value}</span>
- Sistema operativo del Dispositivo: <span class="resultado-label">${label_osInput.value}</span>
- Persistencia al desplazamiento:  ¿La señal vuelve al moverse?: <span class="resultado-label">${label_persistenciaInput.value}</span>
- Marca y modelo del equipo: <span class="resultado-label">${label_marcamodeloInput.value}</span>
- Barras de señal: <span class="resultado-label">${label_barrasInput.value}</span>
- Cantidad de KB vigente al momento de escalar: <span class="resultado-label">${label_kbInput.value}</span>
- ¿Se probó el chip en otro equipo y se solucionó el inconveniente?: <span class="resultado-label">${label_otroequipoInput.value}</span>
- Detalle del inconveniente: <span class="resultado-label">${label_DetalleIncInput.value}</span>
- $$_<span class="resultado-label">${labelIDInput.value}</span>_&&`;
}

    function capitalizeFirstLetter(string) {
      if(!string) return ""; 
      return string.charAt(0).toUpperCase() + string.slice(1).toLowerCase();
    }

    function checkLength(input) {
        if (input.value.length > 9) {
          input.value = input.value.slice(0, 9);
        }
    }

    // NUEVA FUNCIÓN PARA ABRIR MAPAS CENTRADO
    function abrirMapa() {
      const width = 800;
      const height = 600;
      const left = (window.screen.width / 2) - (width / 2);
      const top = (window.screen.height / 2) - (height / 2);
      window.open('https://www.google.com/maps', 'GoogleMapsPopup', `width=${width},height=${height},top=${top},left=${left},scrollbars=yes,resizable=yes`);
    }

    function copiarResultado() {
        let camposFaltantes = false;
        
        // Verificamos si algún input está vacío
        for (let i = 0; i < todosLosInputs.length; i++) {
            if (todosLosInputs[i].value.trim() === "") {
                camposFaltantes = true;
                break;
            }
        }

        const resultadoTexto = resultadoOutput.innerText.trim();
        const textarea = document.createElement("textarea");
        textarea.value = resultadoTexto;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);

        // Lógica del mensaje visual
        const mensajeCopia = document.getElementById("mensaje-copia");
        if (camposFaltantes) {
            mensajeCopia.innerText = "⚠️ Copiado (Faltan campos por llenar)";
            mensajeCopia.style.color = "#dc3545"; // Rojo
        } else {
            mensajeCopia.innerText = "✅ ¡Copiado exitosamente!";
            mensajeCopia.style.color = "#28a745"; // Verde
        }
        
        mensajeCopia.style.opacity = "1";

        // Ocultar el mensaje después de 3 segundos
        setTimeout(() => {
            mensajeCopia.style.opacity = "0";
        }, 3000);
    }

    function limpiarInputs() {
        todosLosInputs.forEach(input => {
            input.value = "";
        });
        resultadoOutput.innerHTML = "";
    }
</script>
</body>
</html>
